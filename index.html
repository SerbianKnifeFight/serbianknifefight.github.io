function showSection(key) {
  const el = document.getElementById('content');
  el.innerHTML = sections[key] || sections.index;
  document.querySelectorAll('.tree-nav .nav-top').forEach(a => {
    a.classList.toggle('active', a.dataset.section === key);
  });
}

document.querySelectorAll('.tree-nav [data-section]').forEach(link => {
  link.addEventListener('click', e => {
    if (link.tagName === 'A') e.preventDefault();
    const key = link.dataset.section;
    const target = link.dataset.target;
    showSection(key);
    if (target) {
      const el = document.getElementById(target);
      if (el) {
        el.open = true;
        let anc = el.parentElement ? el.parentElement.closest('details') : null;
        while (anc) {
          anc.open = true;
          anc = anc.parentElement ? anc.parentElement.closest('details') : null;
        }
        el.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
    }
    history.replaceState(null, '', '#' + key);
  });
});

const startKey = (location.hash || '#index').slice(1);
showSection(sections[startKey] ? startKey : 'index');

const lastmodEl = document.getElementById('lastmod');
if (lastmodEl) {
  const lm = new Date(document.lastModified);
  lastmodEl.textContent = 'updated ' + lm.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
function openLightbox(src, alt) {
  lightboxImg.src = src;
  lightboxImg.alt = alt;
  lightbox.classList.add('open');
}
function closeLightbox() {
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}
lightbox.addEventListener('click', closeLightbox);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
document.getElementById('content').addEventListener('click', e => {
  const img = e.target.closest('.art-item img');
  if (img) openLightbox(img.src, img.alt);
});

const canvas = document.getElementById("bestagon");
const ctx = canvas.getContext("2d");

let w, h;
function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
window.addEventListener("resize", resize);
resize();

const hexSize = 40;
const hexHeight = Math.sqrt(3) * hexSize;
let time = 0;

function drawHex(x, y, pulse) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 3) * i;
    const px = x + (hexSize + pulse) * Math.cos(angle);
    const py = y + (hexSize + pulse) * Math.sin(angle);
    ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.strokeStyle = `rgba(255, 255, 255, 0.15)`;
  ctx.stroke();
}

function animate() {
  ctx.clearRect(0, 0, w, h);
  let pulse = Math.sin(time * 0.02) * 5;

  for (let row = -1; row < h / (hexHeight * 0.75) + 2; row++) {
    for (let col = -1; col < w / hexSize + 2; col++) {
      let x = col * hexSize * 1.5;
      let y = row * hexHeight + (col % 2 ? hexHeight / 2 : 0);
      drawHex(x, y, pulse);
    }
  }

  time++;
  requestAnimationFrame(animate);
}
animate();
</script>
